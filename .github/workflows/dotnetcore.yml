name: .NET Core (Linux)

on:
  push:
    branches: [master]
    paths:
      - "cs/**"
      - ".github/**"
  pull_request:
    branches: [master]
    paths:
      - "cs/**"
      - ".github/**"

defaults:
  run:
    working-directory: cs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: |
          dotnet restore GS1GMN.sln

      - name: Build
        run: |
          dotnet build GMN/GMN.csproj --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test GMNTests/GMNTests.csproj --no-restore --verbosity normal

      - uses: nikeee/docfx-action@90002010a3a91d103f0a813a9208960b7f217353 # master as of 2026-09-08
        name: Generate docfx documentation
        with:
          args: cs/docfx_project/docfx.json

